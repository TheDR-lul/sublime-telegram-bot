[package]
name = "sublime"
version = "0.1.4"
edition = "2024"
description = "Telegram bot (Rust, teloxide)"
authors = ["sublime"]
license = "MIT"

[dependencies]
teloxide = { version = "0.17", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
toml = "1.0.3"
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.2", features = ["json"] }
rand = "0.10.0"
url = { version = "2", features = ["serde"] }
sentry = { version = "0.46.2", optional = true }
dirs = "6.0.0"
regex = "1"
uuid = { version = "1", features = ["v4"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }

[dev-dependencies]
teloxide_tests = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
testcontainers = "0.26.0"
testcontainers-modules = { version = "0.14", features = ["postgres"] }

[features]
default = []
sentry = ["dep:sentry"]

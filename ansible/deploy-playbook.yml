---
- hosts: all
  gather_facts: yes
  become: true
  vars:
    bot_user: "sublime"
    bot_home: "/home/{{ bot_user }}"
    bot_binary_path: "{{ bot_home }}/sublime"
    bot_config_path: "{{ bot_home }}/config.toml"
    bot_service_name: "sublime-bot"
  
  tasks:
    - name: Create bot user
      user:
        name: "{{ bot_user }}"
        shell: /bin/bash
        create_home: yes
        system: no
    
    - name: Ensure bot home directory exists
      file:
        path: "{{ bot_home }}"
        state: directory
        owner: "{{ bot_user }}"
        group: "{{ bot_user }}"
        mode: '0755'
    
    - name: Copy binary to server
      copy:
        src: sublime
        dest: "{{ bot_binary_path }}"
        owner: "{{ bot_user }}"
        group: "{{ bot_user }}"
        mode: '0755'
        remote_src: no
    
    - name: Ensure config directory exists
      file:
        path: "{{ bot_home }}/.config/sublime-bot"
        state: directory
        owner: "{{ bot_user }}"
        group: "{{ bot_user }}"
        mode: '0755'
    
    - name: Create systemd service file
      template:
        src: sublime-bot.service.j2
        dest: /etc/systemd/system/{{ bot_service_name }}.service
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd
    
    - name: Enable and start bot service
      systemd:
        name: "{{ bot_service_name }}"
        enabled: yes
        state: restarted
        daemon_reload: yes
  
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

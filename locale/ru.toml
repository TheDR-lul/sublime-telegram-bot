# Правила игры (HTML, длинный текст)
rules_html           = """Правила игры <b>Пидор Дня</b> (только для групповых чатов):
<b>1.</b> Зарегистрируйтесь в игру по команде /pidoreg
<b>2.</b> Подождите пока зарегистрируются все (или большинство :)
<b>3.</b> Запустите розыгрыш по команде /pidor
<b>4.</b> Просмотр статистики канала по команде /pidorstats, /pidorall
<b>5.</b> Личная статистика по команде /pidorme
<b>6.</b> Статистика за последний год по команде /pidor2024 (например /pidor2020, /pidor2019 и т.д.)
<b>7. (!!! Только для администраторов чатов)</b>: удалить из игры может только Админ канала, сначала выведя по команде список игроков: /pidormin list
Удалить же игрока можно по команде (используйте идентификатор пользователя - цифры из списка пользователей): /pidormin del 123456

<b>Важно</b>, розыгрыш проходит только <b>раз в день</b>, повторная команда выведет <b>результат</b> игры.

Сброс розыгрыша происходит каждый день в 12 часов ночи по киевскому времени (UTC+2 / UTC+3 в зависимости от сезона).

Поддержать бота можно по <a href=\"https://github.com/TheDR-lul/sublime\">ссылке</a> :)"""


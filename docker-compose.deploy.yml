# Deploy: use pre-built image (no build on server). Token via TELEGRAM_BOT_TOKEN.
# Notification bot (watchdog): set NOTIFICATION_BOT_TOKEN in .env.watchdog and run with --profile watchdog.
services:
  db:
    image: postgres:17
    container_name: sublime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sublime_bot
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    image: sublime-bot:latest
    container_name: sublime-bot
    restart: unless-stopped
    environment:
      TELOXIDE_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NOTIFICATION_BOT_TOKEN: ${NOTIFICATION_BOT_TOKEN:-}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID:-}
      DATABASE_URL: postgres://postgres:postgres@db:5432/sublime_bot
      RUST_LOG: info
    depends_on:
      - db

  watchdog:
    image: sublime-bot:latest
    container_name: sublime-watchdog
    restart: unless-stopped
    profiles:
      - watchdog
    env_file:
      - path: .env.watchdog
        required: false
    environment:
      TELOXIDE_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgres://postgres:postgres@db:5432/sublime_bot
      WATCHDOG_CONTAINER: sublime-bot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/app/sublime", "watchdog", "run"]
    depends_on:
      - db

volumes:
  postgres-data:

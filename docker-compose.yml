services:
  db:
    image: postgres:17
    container_name: sublime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sublime_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sublime-bot
    restart: unless-stopped
    environment:
      # Передай токен бота через переменную окружения или .env
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN}
      DATABASE_URL: postgres://postgres:postgres@db:5432/sublime_bot
      RUST_LOG: info
    depends_on:
      - db

volumes:
  postgres-data:

